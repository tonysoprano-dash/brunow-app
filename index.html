<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Itinerary Planner</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Instrument Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Instrument Sans', sans-serif;
      background-color: #1E293B;
      user-select: none;
    }

    /* Custom Scrollbar styling */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Subtle custom card shadows matching Figma spec */
    .card-shadow {
      box-shadow: 17px 10px 15.5px rgba(0, 0, 0, 0.05),
                  -3.2px 27.7px 27.7px rgba(0, 0, 0, 0.04),
                  -8.1px 62px 37.5px rgba(0, 0, 0, 0.03);
    }

    /* Interactive calendar button animation */
    .day-btn {
      transition: all 0.15s ease-in-out;
    }
    .day-btn:hover {
      background-color: #EAEAEA;
    }
    .day-btn.selected {
      background-color: #739C8F;
      color: #FFFFFF;
      font-weight: 600;
      transform: scale(1.1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-6">

  <!-- Mobile Device Outer Container (430px x 932px) -->
  <div class="relative w-full max-w-[430px] h-[932px] bg-[#C2E6DB] rounded-[48px] shadow-2xl overflow-hidden border-[8px] border-[#0F172A] flex flex-col">
    
    <!-- Camera Notch Dynamic Island Element -->
    <div class="absolute top-2 left-1/2 -translate-x-1/2 w-32 h-4 bg-black rounded-full z-50 flex items-center justify-center gap-2">
      <div class="w-2.5 h-2.5 bg-[#111] rounded-full"></div>
      <div class="w-1.5 h-1.5 bg-[#0a192f] rounded-full"></div>
    </div>

    <!-- ================= STEP 1: FORM VIEW ================= -->
    <div id="step-1-view" class="relative w-full h-full pt-[26px] flex flex-col">
      
      <!-- Top Navigation Header -->
      <div class="relative w-full h-[50px] flex items-center justify-center px-6">
        <button id="back-btn-step1" class="absolute left-6 w-[36px] h-[30px] flex items-center justify-center hover:opacity-70 transition-opacity">
          <svg class="w-6 h-6 text-black transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
          </svg>
        </button>
        <span class="text-[18px] font-normal text-black tracking-wide">Itinerary</span>
      </div>

      <!-- Scrollable Main Form -->
      <div class="flex-1 overflow-y-auto px-[20px] pt-[10px] pb-[90px] space-y-[16px] scrollbar-none">
        
        <!-- Card 1: Create your Plans -->
        <div class="relative w-full bg-white rounded-[19px] p-[20px] card-shadow border border-[#F5F5F5]">
          <h2 class="text-[24px] font-normal text-black leading-tight">Create your Plans</h2>
          <p class="text-[15px] font-normal text-black mt-1 mb-4">Personalized for you.</p>

          <div class="space-y-[10px]">
            <!-- Trip Name Input -->
            <div class="relative w-full">
              <input
                type="text"
                id="trip-name-input"
                value="Tokyo Adventure"
                placeholder="Trip Name"
                class="w-full h-[36px] px-3 bg-[#EAEAEA] rounded-[4px] text-[15px] text-black placeholder-[#B3B1B1] outline-none focus:ring-1 focus:ring-[#739C8F]"
              />
            </div>

            <!-- Date Selector with Calendar Trigger -->
            <div class="relative w-full">
              <button
                type="button"
                id="date-trigger-btn"
                class="w-full h-[36px] px-3 bg-[#EAEAEA] rounded-[4px] text-[15px] flex items-center justify-between text-left outline-none focus:ring-1 focus:ring-[#739C8F]"
              >
                <span id="selected-date-text" class="text-black">15/01/26</span>
                <svg class="w-4 h-4 text-[#739C8F]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              </button>

              <!-- Interactive Popup Calendar Widget with Year & Month Selection -->
              <div 
                id="calendar-popup" 
                class="hidden absolute left-0 top-[42px] z-50 w-[250px] bg-white rounded-[10px] p-3 shadow-2xl border border-[#E0E0E0]"
              >
                <!-- Calendar Header with Month/Year Dropdowns -->
                <div class="flex items-center justify-between mb-2 px-1 gap-1">
                  <select id="cal-month-select" class="text-[12px] font-semibold text-black bg-[#F5F5F5] border border-gray-200 rounded px-1 py-0.5 outline-none cursor-pointer">
                    <option value="0">January</option>
                    <option value="1">February</option>
                    <option value="2">March</option>
                    <option value="3">April</option>
                    <option value="4">May</option>
                    <option value="5">June</option>
                    <option value="6">July</option>
                    <option value="7">August</option>
                    <option value="8">September</option>
                    <option value="9">October</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                  </select>

                  <select id="cal-year-select" class="text-[12px] font-semibold text-black bg-[#F5F5F5] border border-gray-200 rounded px-1 py-0.5 outline-none cursor-pointer">
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                  </select>

                  <div class="flex items-center gap-0.5 ml-auto">
                    <button type="button" id="cal-prev-btn" class="p-1 hover:bg-[#F0F0F0] rounded text-[#739C8F]">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <button type="button" id="cal-next-btn" class="p-1 hover:bg-[#F0F0F0] rounded text-[#739C8F]">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"/></svg>
                    </button>
                  </div>
                </div>

                <!-- Days of Week Header -->
                <div class="grid grid-cols-7 text-center mb-1 text-[10px] text-gray-600 font-medium">

                <!-- Days Grid (1 to 31 dynamic insertion) -->

        </div>

        <!-- Card 2: How many days? -->

          <h3 class="text-[24px] font-normal text-black mb-4">How many days?</h3>
          <div class="space-y-3" id="duration-options">
            <!-- Duration Options -->
            <div class="duration-option flex items-center gap-3 cursor-pointer group" data-value="Half Day">

                <svg class="check-icon w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">

                </svg>
              </div>
              <span class="text-[15px] text-black font-normal">Half Day</span>
            </div>
            <div class="duration-option flex items-center gap-3 cursor-pointer group" data-value="1 Day">
              <div class="checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[rgba(64,64,64,0.35)] flex items-center justify-center transition-all">
                <svg class="check-icon w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <span class="text-[15px] text-black font-normal">1 Day</span>
            </div>
            <div class="duration-option flex items-center gap-3 cursor-pointer group" data-value="2 Days">
              <div class="checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[#739C8F] bg-[#739C8F] flex items-center justify-center transition-all">
                <svg class="check-icon w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <span class="text-[15px] text-black font-normal">2 Days</span>
            </div>
            <div class="duration-option flex items-center gap-3 cursor-pointer group" data-value="3+ Days">
              <div class="checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[rgba(64,64,64,0.35)] flex items-center justify-center transition-all">
                <svg class="check-icon w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <span class="text-[15px] text-black font-normal">3+ Days</span>

          </div>
        </div>

        <!-- Card 3: What do you like? -->
        <div class="relative w-full bg-white rounded-[19px] p-[20px] card-shadow border border-[#F5F5F5]">
          <h3 class="text-[24px] font-normal text-black mb-4">What do you like?</h3>
          <div class="space-y-3" id="preference-options">
            
            <div class="pref-option flex items-center gap-3 cursor-pointer group" data-value="Nature">
              <div class="checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[#739C8F] bg-[#739C8F] flex items-center justify-center transition-all">
                <svg class="check-icon w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <span class="text-[15px] text-black font-normal">Nature</span>
            </div>

            <div class="pref-option flex items-center gap-3 cursor-pointer group" data-value="Food">
              <div class="checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[#739C8F] bg-[#739C8F] flex items-center justify-center transition-all">
                <svg class="check-icon w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </div>

            </div>

            <div class="pref-option flex items-center gap-3 cursor-pointer group" data-value="Museums">
              <div class="checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[rgba(64,64,64,0.35)] flex items-center justify-center transition-all">
                <svg class="check-icon w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <span class="text-[15px] text-black font-normal">Museums</span>
            </div>

            <div class="pref-option flex items-center gap-3 cursor-pointer group" data-value="Culture">
              <div class="checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[#739C8F] bg-[#739C8F] flex items-center justify-center transition-all">
                <svg class="check-icon w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <span class="text-[15px] text-black font-normal">Culture</span>
            </div>

            <div class="pref-option flex items-center gap-3 cursor-pointer group" data-value="Shopping">
              <div class="checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[rgba(64,64,64,0.35)] flex items-center justify-center transition-all">
                <svg class="check-icon w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <span class="text-[15px] text-black font-normal">Shopping</span>
            </div>

            <div class="pref-option flex items-center gap-3 cursor-pointer group" data-value="Photography">
              <div class="checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[rgba(64,64,64,0.35)] flex items-center justify-center transition-all">
                <svg class="check-icon w-3 h-3 text-white hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <span class="text-[15px] text-black font-normal">Photography</span>
            </div>

            <div class="pref-option flex items-center gap-3 cursor-pointer group" data-value="Family">

          class="flex items-center justify-center gap-2 w-[113px] h-[32px] bg-gradient-to-r from-[#B0DDD0]/30 to-[#498E79]/30 bg-[#98C2B5] rounded-[13px] shadow-md hover:brightness-105 active:scale-95 transition-all text-black text-[15px] font-medium"

    <!-- ================= STEP 2: "NOW THE FUN PART" ITINERARY VIEW ================= -->
    <div id="step-2-view" class="hidden relative w-full h-full pt-[26px] bg-[#C2E6DB] flex-col">
      
      <!-- Top Navigation Header -->
      <div class="relative w-full h-[50px] flex items-center justify-center px-6 shrink-0">
        <button id="back-to-step1-btn" class="absolute left-6 w-[36px] h-[30px] flex items-center justify-center hover:opacity-70 transition-opacity">
          <svg class="w-6 h-6 text-black transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
          </svg>
        </button>
        <span class="text-[18px] font-normal text-black tracking-wide">Itinerary</span>
      </div>

      <!-- Subtitle Title -->
      <div class="px-[32px] pt-[10px] pb-[8px]">
        <h2 class="text-[24px] font-normal text-black leading-tight">Now the fun part.</h2>
      </div>

      <!-- Main Step 2 Scrollable Container -->
      <div class="flex-1 overflow-y-auto px-[20px] pb-[90px] scrollbar-none">
        
        <!-- Large Step 2 White Card (Figma Spec) -->
        <div id="day-card-container" class="relative w-full bg-white rounded-[19px] p-[20px] card-shadow border border-[#F5F5F5] min-h-[620px] flex flex-col gap-4">
          
          <!-- Day Header Title -->
          <h3 id="step2-day-title" class="text-[24px] font-normal text-black">Day 1</h3>

          <!-- Dynamic Itinerary Plan Blocks Container -->
          <div id="itinerary-blocks-container" class="space-y-4">
            <!-- Injected via renderItinerary() -->
          </div>

          <!-- Bottom Add Place Button -->
          <div class="pt-2 border-t border-gray-100">
            <button 
              id="btn-add-place-block" 
              class="w-full flex items-center gap-3 text-left hover:bg-gray-50 p-2 rounded-lg transition-colors group"
            >
              <div class="w-6 h-6 bg-black rounded flex items-center justify-center shrink-0">
                <span class="text-[#F7CD4F] font-bold text-base leading-none">+</span>
              </div>
              <span class="text-[15px] text-black font-normal">Add Place</span>
            </button>
          </div>

        </div>

      </div>

      <!-- Bottom Continue Button in Step 2 -->
      <div class="absolute bottom-6 right-[20px] z-10">
        <button 
          id="continue-step2-btn"
          class="flex items-center justify-center gap-2 w-[113px] h-[32px] bg-gradient-to-r from-[#B0DDD0]/30 to-[#498E79]/30 bg-[#98C2B5] rounded-[13px] shadow-md hover:brightness-105 active:scale-95 transition-all text-black text-[15px] font-medium"
        >
          <span>Continue</span>
          <div class="w-4 h-4 rounded-full bg-white/40 flex items-center justify-center">
            <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </div>
        </button>
      </div>

    </div>

    <!-- Modal Popup Dialog for Dynamic Inputs -->
    <div id="input-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl p-5 w-full max-w-[340px] shadow-2xl border border-gray-100 flex flex-col gap-3 animate-in fade-in zoom-in-95">
        <h4 id="modal-title" class="text-lg font-semibold text-gray-900">Add Item</h4>
        
        <div id="modal-fields-container" class="space-y-2">
          <!-- Dynamic inputs will be placed here -->
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button id="modal-cancel-btn" type="button" class="px-4 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
          <button id="modal-confirm-btn" type="button" class="px-4 py-1.5 text-xs font-medium text-white bg-[#739C8F] rounded-lg hover:bg-[#5b8074]">Add</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    /* App State Variables */
    let selectedDate = { year: 2026, month: 0, day: 15 }; // Month 0 = Jan
    let currentCalYear = 2026;
    let currentCalMonth = 0; // January
    let selectedDuration = '2 Days';
    let selectedPreferences = ['Nature', 'Food', 'Culture'];
    let modalActionType = '';
    let targetPlaceId = null;

    /* Structured Itinerary Data (Grouped by Place Plans) */
    let itineraryData = [
      {
        id: 1,
        place: 'Royal Regalia Museum',
        time: '9:00 AM',
        tasks: [
          { id: 101, text: 'Remember to bring cash.', checked: true },
          { id: 102, text: 'Take photos', checked: true },
          { id: 103, text: 'Visit Gift Shop', checked: false }
        ]
      }
    ];

    const monthNames = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    /* Helper: Format date string as DD/MM/YY */
    function formatDateString(dateObj) {
      if (!dateObj) return 'dd/mm/yy';
      const day = String(dateObj.day).padStart(2, '0');
      const month = String(dateObj.month + 1).padStart(2, '0');
      const year = String(dateObj.year).slice(-2);
      return `${day}/${month}/${year}`;
    }

    /* Helper: Get days in specific month */
    function getDaysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    /* Helper: Get starting weekday (0 = Sun, 1 = Mon...) */
    function getFirstDayOfWeek(year, month) {
      return new Date(year, month, 1).getDay();
    }

    /* Helper: Escape HTML strings to prevent layout breaks */
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    /* Render 1-31 Calendar Grid */
    function renderCalendar() {
      const monthSelect = document.getElementById('cal-month-select');
      const yearSelect = document.getElementById('cal-year-select');
      const gridContainer = document.getElementById('calendar-days-grid');

      monthSelect.value = currentCalMonth;
      yearSelect.value = currentCalYear;
      gridContainer.innerHTML = '';

      const totalDays = getDaysInMonth(currentCalYear, currentCalMonth);
      const startDay = getFirstDayOfWeek(currentCalYear, currentCalMonth);

      // Render empty padding cells
      for (let i = 0; i < startDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'w-[22px] h-[22px]';
        gridContainer.appendChild(emptyCell);
      }

      // Render day cells from 1 to 31
      for (let day = 1; day <= totalDays; day++) {
        const dayBtn = document.createElement('button');
        dayBtn.type = 'button';
        dayBtn.textContent = day;
        
        const isSelected = selectedDate &&
          selectedDate.year === currentCalYear &&
          selectedDate.month === currentCalMonth &&
          selectedDate.day === day;

        dayBtn.className = `day-btn w-[22px] h-[22px] rounded-full flex items-center justify-center text-[10px] ${
          isSelected ? 'selected' : 'text-black'
        }`;

        dayBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedDate = {
            year: currentCalYear,
            month: currentCalMonth,
            day: day
          };
          
          document.getElementById('selected-date-text').textContent = formatDateString(selectedDate);
          document.getElementById('calendar-popup').classList.add('hidden');
          renderCalendar();
        });

        gridContainer.appendChild(dayBtn);
      }
    }

    /* Toggle Task Checkmark State */
    window.toggleTaskCheck = function(placeId, taskId) {
      const placeObj = itineraryData.find(p => p.id === placeId);
      if (placeObj) {
        const taskObj = placeObj.tasks.find(t => t.id === taskId);
        if (taskObj) {
          taskObj.checked = !taskObj.checked;
          renderItinerary();
        }
      }
    };

    /* Open Add Task Modal for a Specific Place Block */
    window.openAddTaskModal = function(placeId) {
      targetPlaceId = placeId;
      modalActionType = 'task';
      
      document.getElementById('modal-title').textContent = 'Add Another Task';
      const container = document.getElementById('modal-fields-container');
      container.innerHTML = `
        <input 
          type="text" 
          id="modal-input-task" 
          placeholder="e.g. Buy souvenirs" 
          class="w-full px-3 py-2 bg-gray-100 rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#739C8F]"
        />
      `;
      document.getElementById('input-modal').classList.remove('hidden');
      document.getElementById('modal-input-task').focus();
    };

    /* Render Structured Itinerary Blocks in Step 2 */
    function renderItinerary() {
      const container = document.getElementById('itinerary-blocks-container');
      if (!container) return;
      container.innerHTML = '';

      itineraryData.forEach((item, index) => {
        const block = document.createElement('div');
        block.className = 'place-plan-block space-y-3';

        // Block Content (📍 Place, ⏰ Time, 📝 Notes and Checklists)
        block.innerHTML = `
          <div class="space-y-1.5 text-[15px]">
            <div class="flex items-center gap-2">
              <span class="text-black font-normal flex items-center gap-1 shrink-0">📍 Place :</span>
              <span class="text-black font-normal leading-tight">${escapeHtml(item.place)}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-black font-normal flex items-center gap-1 shrink-0">⏰ Time :</span>
              <span class="text-black font-normal leading-tight">${escapeHtml(item.time)}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-black font-normal flex items-center gap-1 shrink-0">📝 Notes :</span>
            </div>
          </div>

          <!-- Dynamic Task List for this specific plan -->
          <div class="task-list space-y-2.5 pt-0.5">
            ${item.tasks.map(task => `
              <div 
                class="task-item flex items-center gap-3 cursor-pointer group"
                onclick="toggleTaskCheck(${item.id}, ${task.id})"
              >
                <div class="checkbox-box w-[17px] h-[16px] rounded-[3px] ${task.checked ? 'border-[#739C8F] bg-[#739C8F]' : 'border-[rgba(64,64,64,0.35)]'} flex items-center justify-center transition-all shrink-0">
                  <svg class="check-icon w-3 h-3 text-white ${task.checked ? '' : 'hidden'}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                  </svg>
                </div>
                <span class="text-[13px] text-black font-normal">${escapeHtml(task.text)}</span>
              </div>
            `).join('')}
          </div>

          <!-- Add Another Task Button for this Plan -->
          <div class="pt-1">
            <button 
              type="button"
              onclick="openAddTaskModal(${item.id})" 
              class="flex items-center gap-2.5 text-left hover:bg-gray-50 px-1 py-1 rounded transition-colors group"
            >
              <div class="w-5 h-5 bg-black rounded flex items-center justify-center shrink-0">
                <span class="text-[#F7CD4F] font-bold text-sm leading-none">+</span>
              </div>
              <span class="text-[13px] text-black font-normal">Add Another Task</span>
            </button>
          </div>
        `;

        container.appendChild(block);

        // Add a dividing line after each plan block to cleanly separate plans
        if (index < itineraryData.length) {
          const hr = document.createElement('div');
          hr.className = 'w-full my-4 border-t border-gray-200';
          container.appendChild(hr);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCalendar();

      const dateTriggerBtn = document.getElementById('date-trigger-btn');
      const calendarPopup = document.getElementById('calendar-popup');
      const calPrevBtn = document.getElementById('cal-prev-btn');
      const calNextBtn = document.getElementById('cal-next-btn');
      const monthSelect = document.getElementById('cal-month-select');
      const yearSelect = document.getElementById('cal-year-select');

      // Toggle Calendar Visibility
      dateTriggerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        calendarPopup.classList.toggle('hidden');
      });

      calendarPopup.addEventListener('click', (e) => e.stopPropagation());
      document.addEventListener('click', () => calendarPopup.classList.add('hidden'));

      // Calendar Dropdown Navigation
      monthSelect.addEventListener('change', (e) => {
        currentCalMonth = parseInt(e.target.value);
        renderCalendar();
      });

      yearSelect.addEventListener('change', (e) => {
        currentCalYear = parseInt(e.target.value);
        renderCalendar();
      });

      calPrevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentCalMonth === 0) {
          currentCalMonth = 11;
          currentCalYear--;
        } else {
          currentCalMonth--;
        }
        renderCalendar();
      });

      calNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentCalMonth === 11) {
          currentCalMonth = 0;
          currentCalYear++;
        } else {
          currentCalMonth++;
        }
        renderCalendar();
      });

      // Duration Selection Logic
      const durationOptions = document.querySelectorAll('.duration-option');
      durationOptions.forEach(option => {
        option.addEventListener('click', () => {
          const val = option.getAttribute('data-value');
          selectedDuration = val;

          durationOptions.forEach(opt => {
            const box = opt.querySelector('.checkbox-box');
            const checkIcon = opt.querySelector('.check-icon');
            if (opt.getAttribute('data-value') === val) {
              box.className = 'checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[#739C8F] bg-[#739C8F] flex items-center justify-center transition-all';
              if (checkIcon) checkIcon.classList.remove('hidden');
            } else {
              box.className = 'checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[rgba(64,64,64,0.35)] flex items-center justify-center transition-all';
              if (checkIcon) checkIcon.classList.add('hidden');
            }
          });
        });
      });

      // Preference Selection Logic
      const prefOptions = document.querySelectorAll('.pref-option');
      prefOptions.forEach(option => {
        option.addEventListener('click', () => {
          const val = option.getAttribute('data-value');
          const box = option.querySelector('.checkbox-box');
          const checkIcon = option.querySelector('.check-icon');

          if (selectedPreferences.includes(val)) {
            selectedPreferences = selectedPreferences.filter(p => p !== val);
            box.className = 'checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[rgba(64,64,64,0.35)] flex items-center justify-center transition-all';
            if (checkIcon) checkIcon.classList.add('hidden');
          } else {
            selectedPreferences.push(val);
            box.className = 'checkbox-box w-[17px] h-[16px] rounded-[3px] border border-[#739C8F] bg-[#739C8F] flex items-center justify-center transition-all';
            if (checkIcon) checkIcon.classList.remove('hidden');
          }
        });
      });

      // Navigation: Step 1 -> Step 2 transition
      const continueBtn = document.getElementById('continue-btn');
      const step1View = document.getElementById('step-1-view');
      const step2View = document.getElementById('step-2-view');
      const backToStep1Btn = document.getElementById('back-to-step1-btn');

      continueBtn.addEventListener('click', () => {
        step1View.classList.add('hidden');
        step2View.classList.remove('hidden');
        step2View.classList.add('flex');
        renderItinerary();
      });

      backToStep1Btn.addEventListener('click', () => {
        step2View.classList.add('hidden');
        step2View.classList.remove('flex');
        step1View.classList.remove('hidden');
      });

      // Modal Input Dialog Handlers
      const inputModal = document.getElementById('input-modal');
      const modalCancelBtn = document.getElementById('modal-cancel-btn');
      const modalConfirmBtn = document.getElementById('modal-confirm-btn');

      const closeModal = () => {
        inputModal.classList.add('hidden');
      };

      modalCancelBtn.addEventListener('click', closeModal);

      // Add New Place Block Button Event
      document.getElementById('btn-add-place-block').addEventListener('click', () => {
        modalActionType = 'place_block';
        document.getElementById('modal-title').textContent = 'Add New Place / Plan';
        const container = document.getElementById('modal-fields-container');
        container.innerHTML = `
          <div class="space-y-2">
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">📍 Place Name</label>
              <input 
                type="text" 
                id="modal-input-place" 
                placeholder="e.g. Sultan Omar Ali Saifuddien Mosque" 
                class="w-full px-3 py-1.5 bg-gray-100 rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#739C8F]"
              />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">⏰ Time</label>
              <input 
                type="text" 
                id="modal-input-time" 
                placeholder="e.g. 10:30 AM" 
                class="w-full px-3 py-1.5 bg-gray-100 rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#739C8F]"
              />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">📝 Initial Note / Task</label>
              <input 
                type="text" 
                id="modal-input-note" 
                placeholder="e.g. Remove shoes before entering" 
                class="w-full px-3 py-1.5 bg-gray-100 rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#739C8F]"
              />
            </div>
          </div>
        `;
        inputModal.classList.remove('hidden');
        document.getElementById('modal-input-place').focus();
      });

      // Handle Modal Confirm Button
      modalConfirmBtn.addEventListener('click', () => {
        if (modalActionType === 'task') {
          const inputEl = document.getElementById('modal-input-task');
          const val = inputEl ? inputEl.value.trim() : '';
          if (val && targetPlaceId) {
            const placeObj = itineraryData.find(p => p.id === targetPlaceId);
            if (placeObj) {
              placeObj.tasks.push({
                id: Date.now(),
                text: val,
                checked: false
              });
              renderItinerary();
            }
          }
        } else if (modalActionType === 'place_block') {
          const placeVal = document.getElementById('modal-input-place').value.trim() || 'New Destination';
          const timeVal = document.getElementById('modal-input-time').value.trim() || '12:00 PM';
          const noteVal = document.getElementById('modal-input-note').value.trim() || 'Explore area';

          const newPlaceObj = {
            id: Date.now(),
            place: placeVal,
            time: timeVal,
            tasks: [
              { id: Date.now() + 1, text: noteVal, checked: false }
            ]
          };

          itineraryData.push(newPlaceObj);
          renderItinerary();
        }

        closeModal();
      });

      document.getElementById('continue-step2-btn').addEventListener('click', () => {
        alert('Itinerary finalized successfully!');
      });
    });
  </script>
</body>
</html>
